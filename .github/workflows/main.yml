
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          find . -maxdepth 3 -type f -name "*.zip" -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project
          find project -maxdepth 4 -type f | head -200

      - name: Build APK
        run: |
          cd project
          GRADLE_FILE=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found. Project structure must be checked."
            exit 1
          fi
          cd "$(dirname "$GRADLE_FILE")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
